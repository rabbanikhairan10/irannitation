<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRANNITATION</title>

<meta name="description" content="irannitation - game dino 8 bit horror jumpscare">
<meta name="keywords" content="irannitation, dino game, horror game, 8 bit">
<meta name="author" content="irannitation">

<meta property="og:title" content="IRANNITATION">
<meta property="og:description" content="Game horror dino 8 bit dengan jumpscare brutal">
<meta property="og:type" content="website">

<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:monospace;
}

body{
    background:black;
    overflow:hidden;
    color:white;
}

/* efek CRT */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
    );
    animation:flicker .15s infinite;
    z-index:999;
}

@keyframes flicker{
    0%{opacity:.93;}
    50%{opacity:1;}
    100%{opacity:.95;}
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
    linear-gradient(to bottom,#111 0%,#000 100%);
}

#title{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
    letter-spacing:8px;
    color:white;
    text-shadow:0 0 15px white;
    z-index:10;
}

#score{
    position:absolute;
    top:20px;
    right:20px;
    font-size:24px;
    z-index:10;
}

#ground{
    position:absolute;
    bottom:120px;
    width:100%;
    height:6px;
    background:white;
}

#player{
    position:absolute;
    width:70px;
    height:70px;
    left:120px;
    bottom:126px;
    image-rendering:pixelated;
}

.pixel{
    position:absolute;
    width:10px;
    height:10px;
    background:white;
}

.obstacle{
    position:absolute;
    bottom:126px;
    width:55px;
    background:white;
}

#startText{
    position:absolute;
    top:55%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:24px;
    text-align:center;
    opacity:0.8;
}

#jumpscare{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
    flex-direction:column;
}

#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:shake .08s infinite;
}

#jumpscareText{
    position:absolute;
    color:red;
    font-size:70px;
    text-shadow:0 0 25px red;
    animation:glitch .3s infinite;
}

#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:998;
}

@keyframes shake{
    0%{transform:translate(5px,5px);}
    25%{transform:translate(-5px,0);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,5px);}
    100%{transform:translate(0,0);}
}

@keyframes glitch{
    0%{transform:translate(0);}
    20%{transform:translate(-3px,2px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,1px);}
    80%{transform:translate(2px,-1px);}
    100%{transform:translate(0);}
}

</style>
</head>
<body>

<div id="game">

    <div id="title">IRANNITATION</div>

    <div id="score">0</div>

    <div id="ground"></div>

    <!-- Dino 8 Bit -->
    <div id="player">

        <div class="pixel" style="left:20px;top:0"></div>
        <div class="pixel" style="left:30px;top:0"></div>
        <div class="pixel" style="left:40px;top:0"></div>

        <div class="pixel" style="left:10px;top:10px"></div>
        <div class="pixel" style="left:20px;top:10px"></div>
        <div class="pixel" style="left:30px;top:10px"></div>
        <div class="pixel" style="left:40px;top:10px"></div>
        <div class="pixel" style="left:50px;top:10px"></div>

        <div class="pixel" style="left:10px;top:20px"></div>
        <div class="pixel" style="left:20px;top:20px"></div>
        <div class="pixel" style="left:30px;top:20px"></div>
        <div class="pixel" style="left:40px;top:20px"></div>

        <div class="pixel" style="left:20px;top:30px"></div>
        <div class="pixel" style="left:30px;top:30px"></div>

        <div class="pixel" style="left:10px;top:40px"></div>
        <div class="pixel" style="left:20px;top:40px"></div>
        <div class="pixel" style="left:40px;top:40px"></div>

        <div class="pixel" style="left:10px;top:50px"></div>
        <div class="pixel" style="left:40px;top:50px"></div>

    </div>

    <div id="startText">
        TAP / SPACE UNTUK MULAI
    </div>

</div>

<div id="flash"></div>

<div id="jumpscare">
    <img src="https://i.imgur.com/6RL9K0I.jpeg">
    <div id="jumpscareText">GAME OVER</div>
</div>

<audio id="scareSound">
<source src="https://www.myinstants.com/media/sounds/loud-jumpscare.mp3">
</audio>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const jumpscare = document.getElementById("jumpscare");
const scareSound = document.getElementById("scareSound");
const flash = document.getElementById("flash");

let jumping = false;
let velocity = 0;
let gravity = 1.1;
let playerY = 126;

let obstacles = [];
let score = 0;

let gameStarted = false;
let gameOver = false;

let speed = 6;

function jump(){

    if(jumping || gameOver) return;

    jumping = true;

    velocity = 22;

}

document.addEventListener("keydown",(e)=>{

    if(e.code === "Space"){

        if(!gameStarted){
            startGame();
        }

        jump();

    }

});

document.addEventListener("touchstart",()=>{

    if(!gameStarted){
        startGame();
    }

    jump();

});

function startGame(){

    gameStarted = true;

    document.getElementById("startText").style.display = "none";

}

function createObstacle(){

    const obs = document.createElement("div");

    obs.classList.add("obstacle");

    const height = Math.random() * 40 + 45;

    obs.style.height = height + "px";

    obs.style.left = window.innerWidth + "px";

    game.appendChild(obs);

    obstacles.push(obs);

}

setInterval(()=>{

    if(gameStarted && !gameOver){

        createObstacle();

    }

},1700);

function endGame(){

    gameOver = true;

    flash.style.opacity = "1";

    setTimeout(()=>{

        flash.style.opacity = "0";

    },100);

    jumpscare.style.display = "flex";

    scareSound.volume = 1;

    scareSound.play();

    if(navigator.vibrate){

        navigator.vibrate([200,100,200]);

    }

    setTimeout(()=>{

        location.reload();

    },2500);

}

function update(){

    requestAnimationFrame(update);

    if(!gameStarted || gameOver) return;

    velocity -= gravity;

    playerY += velocity;

    if(playerY <= 126){

        playerY = 126;

        jumping = false;

    }

    player.style.bottom = playerY + "px";

    obstacles.forEach((obs,index)=>{

        let x = parseFloat(obs.style.left);

        x -= speed;

        obs.style.left = x + "px";

        const playerRect = player.getBoundingClientRect();

        const obsRect = obs.getBoundingClientRect();

        if(

            playerRect.left < obsRect.right &&
            playerRect.right > obsRect.left &&
            playerRect.bottom > obsRect.top &&
            playerRect.top < obsRect.bottom

        ){

            endGame();

        }

        if(x < -100){

            obs.remove();

            obstacles.splice(index,1);

            score++;

            scoreText.innerText = score;

            speed += 0.25;

        }

    });

}

update();

</script>

</body>
</html>
